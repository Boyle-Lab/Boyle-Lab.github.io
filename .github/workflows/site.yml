name: Build publications, CV, and deploy site

on:
  push:
    branches:
      - main
      - master
    paths:
      - "bibliography/publications.bib"
      - "publication_metadata/**"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "bibliography/publications.bib"
      - "publication_metadata/**"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Start branch builds at the latest commit; retain the PR merge ref.
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-publications.txt

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements-publications.txt

      - name: Install LuaLaTeX for the tagged CV
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fonts-liberation2 \
            texlive-latex-extra \
            texlive-luatex

      - name: Generate publication records
        run: python scripts/build_publications.py --strict

      - name: Generate and compile the CV
        run: python scripts/build_cv.py --strict --compile

      - name: Run repository tests
        run: python -m unittest discover -s tests -v

      - name: Require generated files to be committed in pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- _papers pub.bib cv/generated)" ]]; then
            git status --short -- _papers pub.bib cv/generated
            echo "Generated publication or CV source files are not current. Run make publications and make cv-source, then commit the result."
            exit 1
          fi

      - name: Commit regenerated publication and CV files
        if: github.event_name != 'pull_request' && github.ref_type == 'branch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            source_commit="$(git rev-parse HEAD)"
            git add --all -- _papers pub.bib cv/generated assets/ABoyle_CV.pdf
            if git diff --cached --quiet; then
              echo "Publication and CV files are already current."
            else
              git commit -m "Update generated publications and CV [skip ci]"
            fi

            # Even an unchanged build must check that its branch is current.
            if git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
              exit 0
            fi

            git fetch origin "refs/heads/${GITHUB_REF_NAME}"
            remote_commit="$(git rev-parse FETCH_HEAD)"
            if [[ "$remote_commit" == "$(git rev-parse HEAD)" ]]; then
              echo "The generated commit is already on the remote branch."
              exit 0
            fi
            if [[ "$remote_commit" == "$source_commit" ]]; then
              echo "::error::Push failed without a newer remote commit. Check the push error and repository permissions."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$source_commit" "$remote_commit"; then
              echo "::error::Remote branch history changed. Start a new workflow run from the current branch."
              exit 1
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "::error::The branch kept changing during the build. Start a new workflow run."
              exit 1
            fi

            echo "The remote branch advanced; rebuilding from its latest commit (retry $attempt of 2)."
            # Only the disposable runner checkout is reset. The remote is never forced.
            # Rebuild from current sources instead of replaying stale generated files.
            git reset --hard "$remote_commit"
            python -m pip install --requirement requirements-publications.txt
            python scripts/build_publications.py --strict
            python scripts/build_cv.py --strict --compile
            python -m unittest discover -s tests -v
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          verbose: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
