    abstract = {Dimensionality-reduction methods are widely used to break down complex datasets into more manageable subunits. Self-organizing maps can project high-dimensional data onto a two-dimensional grid in which nearby nodes represent modules with similar properties, but existing tools do not support real-time exploration or projection of covariate data. CGIMP is a web application for real-time analysis of self-organizing maps for genomic datasets. It renders interactive maps from JSON inputs, provides data-driven search facets, and intersects underlying genomic intervals with uploaded BED files through a Python adapter to BEDTools.},
