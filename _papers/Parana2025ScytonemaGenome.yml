abstract: |-
  We present the genome sequence of Scytonema sp. PRP1, a cyanobacterium identified during single-cell sequencing library preparation of de-identified human brain samples associated with the Brain Somatic Mosaicism Network. Our 8,266,022 bp genome comprises 140 contigs, containing 6,765 protein-coding sequences, 37 tRNA genes, and 11 rRNA genes.
