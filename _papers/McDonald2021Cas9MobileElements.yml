summary: |-
  Cas9 enrichment coupled with nanopore sequencing captures active mobile element insertions at high coverage and resolves their breakpoints and structure. The method detects insertions missed by standard whole-genome pipelines and establishes a flexible strategy for targeted analysis of repetitive variation.
