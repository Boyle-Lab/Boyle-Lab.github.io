{% assign current_path = page.url | downcase %}

<body class="short-header-page">

<header id="nav-wrap" class="site-nav">
  <div class="container">
    <div class="site-nav-shell">
      <a id="wsite-title" class="site-lab-brand" href="/" aria-label="Boyle Lab home">
        <img src="/assets/images/lab-logo.png" alt="The Boyle Lab" height="50">
      </a>
      <a id="wsite-university" class="site-university-brand" href="https://umich.edu/" aria-label="University of Michigan">
        <img src="/assets/images/U-M_2color-HorizontalReversed.30px.png" alt="University of Michigan" height="30">
      </a>
      <nav id="navigation" aria-label="Primary navigation">
        <ul class="wsite-menu-default">
          <li{% if current_path == '/' %} id="active"{% endif %}><a href="/">Home</a></li>
          <li{% if current_path contains '/research/' %} id="active"{% endif %}><a href="/research/">Research</a></li>
          <li{% if current_path contains '/people/' %} id="active"{% endif %}><a href="/people/">People</a></li>
          <li{% if current_path contains '/software/' %} id="active"{% endif %}><a href="/software/">Software</a></li>
          <li{% if current_path contains '/publications/' or current_path contains '/pub_bib/' %} id="active"{% endif %}><a href="/publications/">Publications</a></li>
          <li{% if current_path contains '/jobs/' %} id="active"{% endif %}><a href="/jobs/">Jobs</a></li>
          <li{% if current_path contains '/news/' %} id="active"{% endif %}><a href="/news/">News</a></li>
          <li{% if current_path contains '/contact/' %} id="active"{% endif %}><a href="/contact/">Contact</a></li>
        </ul>
      </nav>
    </div>
  </div>
</header>
