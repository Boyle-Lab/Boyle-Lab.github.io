title: The Boyle Lab
url: https://boylelab.org
timezone: America/Detroit
strict_front_matter: true

collections:
  jobs:
  papers:
    output: false
  people:
    output: true
    permalink: /people/:path/

defaults:
  - scope:
      path: ""
      type: "people"
    values:
      layout: member

plugins:
  - jekyll-paginate

paginate: 8
paginate_path: /news/page:num
permalink: pretty
array: []

exclude:
  - cv
  - bibliography
  - publication_metadata
  - scripts
  - tests
  - vendor
  - Gemfile
  - Gemfile.lock
  - Makefile
  - requirements-publications.txt
  - README.md
  - SITE_STRUCTURE.md
  - PAGES.md
  - PEOPLE.md
  - PUBLICATIONS.md
  - NEWS_POSTS.md
  - JOBS.md
  - DEVELOPMENT.md
  - STYLES_AND_ASSETS.md
  - CLEANUP.md
  - CV.md
