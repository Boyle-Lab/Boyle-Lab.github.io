collections:
  jobs:
  papers:
    output: false
  people:
    output: true
    permalink: /people/:path/
defaults:
  -
    scope:
      path: ""
      type: "people"
    values:
      layout: "member"
paginate: 8
paginate_path: "/news/page:num"
permalink: pretty
array: []

exclude:
  - bibliography
  - publication_metadata
  - scripts
  - tests
  - requirements-publications.txt
  - Makefile
  - PUBLICATIONS.md
